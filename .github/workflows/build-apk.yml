name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Godot
        run: godot --version

      - name: Build debug APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/logistics-inc-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: logistics-inc-android-debug
          path: build/android/logistics-inc-debug.apk
          if-no-files-found: error
          retention-days: 30
