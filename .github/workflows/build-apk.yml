name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot export environment
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          if [ -d /root/.config/godot ]; then
            rm -rf ~/.config/godot
            mv /root/.config/godot ~/.config/godot
          fi
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            rm -rf "~/.local/share/godot/export_templates/${GODOT_VERSION}.stable" || true
            mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ~/.local/share/godot/export_templates/
          fi
          godot --version

      - name: Build debug APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/logistics-inc-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: logistics-inc-android-debug
          path: build/android/logistics-inc-debug.apk
          if-no-files-found: error
          retention-days: 30
