name: Build Android APK

on:
  push:
    branches: [ main, living-world-v04g ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate living-world art
        run: |
          apt-get update -qq
          apt-get install -y -qq python3
          python3 tools/generate_v04_assets.py
          ls -lh assets/port_backdrop_v04.svg assets/port_backdrop_v05.svg assets/world_map_v04.svg assets/world_map_v05.svg

      - name: Setup Godot export environment
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          if [ -d /root/.config/godot ]; then
            rm -rf ~/.config/godot
            mv /root/.config/godot ~/.config/godot
          fi
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            rm -rf "~/.local/share/godot/export_templates/${GODOT_VERSION}.stable" || true
            mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ~/.local/share/godot/export_templates/
          fi
          godot --version

      - name: Validate Godot scripts
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --quit 2>&1 | tee /tmp/godot-validate.log
          if grep -E "SCRIPT ERROR: (Parse Error|Compile Error)|Failed to load script|Failed to create an autoload" /tmp/godot-validate.log; then
            echo "Godot validation found script errors. Failing the build."
            exit 1
          fi

      - name: Smoke test main scene
        shell: bash
        run: |
          set +e
          timeout 8s godot --headless --path . 2>&1 | tee /tmp/godot-smoke.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            echo "Godot smoke test exited with status $STATUS"
            exit "$STATUS"
          fi
          if grep -E "SCRIPT ERROR:|ERROR: Failed to load script|Invalid call|Invalid access|Parser Error" /tmp/godot-smoke.log; then
            echo "Godot smoke test found runtime/script errors."
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/logistics-inc-debug.apk 2>&1 | tee /tmp/godot-export.log
          if grep -E "SCRIPT ERROR: (Parse Error|Compile Error)|Failed to load script|Failed to create an autoload" /tmp/godot-export.log; then
            echo "Export produced an APK but also reported script errors. Rejecting artifact."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: logistics-inc-android-debug
          path: build/android/logistics-inc-debug.apk
          if-no-files-found: error
          retention-days: 30
